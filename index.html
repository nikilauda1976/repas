<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Les menus de la semaine de la maison, la liste de courses et les recettes en PDF.">
<meta name="theme-color" content="#2f7a4f">
<title>Repas de la maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout : la semaine en une colonne (un soir par ligne), la recette s'ouvre par-dessus ; même palette que « Les menus de la maison » */
:root{
  --bg:#f5f7f2; --surface:#ffffff; --ink:#1d2a24; --muted:#5d6b63; --line:#dbe3dc;
  --basil:#2f7a4f; --basil-soft:#e3f0e7; --saffron:#b86e00; --saffron-soft:#fbf0dc; --on-accent:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --ink:#e6ede8; --muted:#9fb0a6; --line:#2c3832;
  --basil:#6cc493; --basil-soft:#1f3328; --saffron:#f0b45a; --saffron-soft:#33281a; --on-accent:#121815; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ede8; --muted:#9fb0a6; --line:#2c3832;
  --basil:#6cc493; --basil-soft:#1f3328; --saffron:#f0b45a; --saffron-soft:#33281a; --on-accent:#121815; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:22px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
header{display:flex;flex-direction:column;gap:12px}
.weekline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weekline h1{font-size:clamp(26px,6vw,38px);font-weight:700;flex:1 1 260px;min-width:0}
.weekline h1 small{display:block;font-family:var(--body);font-weight:400;font-size:16px;color:var(--muted);margin-top:4px}
.nav{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center;padding:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--basil);color:var(--on-accent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:700}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:progress}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:var(--basil-soft);font-size:14px}
.chip b{color:var(--basil)}

.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
button.day:hover{border-color:var(--basil)}
.day.today{box-shadow:0 0 0 2px var(--basil) inset;border-color:var(--basil)}
.day.free{background:transparent;border-style:dashed}
.dname{font-family:var(--display);font-weight:700;font-size:18px;color:var(--saffron)}
.dname span{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.dmeal{display:flex;flex-direction:column;gap:4px;min-width:0}
.dmeal h3{font-size:18px}
.dmeal .empty{color:var(--muted);font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.meta .kcal{color:var(--saffron);font-weight:700}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--basil)}
.tag.veg{color:var(--saffron)}
@media (max-width:520px){.day{grid-template-columns:1fr;gap:6px}.dname span{display:inline;margin-left:8px}}
h2.section{font-size:20px;margin-top:8px}

.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.shop section h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--basil);padding-bottom:6px;border-bottom:2px solid var(--basil)}
.shop ul{list-style:none;margin:0;padding:0}
.shop label{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;align-items:baseline}
.shop input{accent-color:var(--basil);width:18px;height:18px;transform:translateY(3px);flex:none}
.shop .n{min-width:0}
.shop .q{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-left:8px}
.shop li.done .n{text-decoration:line-through;color:var(--muted)}
.totals{display:flex;flex-wrap:wrap;gap:10px 28px;font-variant-numeric:tabular-nums}
.totals div{display:flex;flex-direction:column}
.totals strong{font-family:var(--display);font-size:24px}
.totals span{font-size:13px;color:var(--muted)}
.note{color:var(--muted);font-size:14px;max-width:65ch}
.cta{color:var(--basil);font-weight:700}

.foyer{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.foyer label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.foyer input{font:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:84px}

.empty-week{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-week p{color:var(--muted);max-width:46ch}

.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);z-index:40}

.sheet-bg{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:21px;flex:1;min-width:0}
.sheet-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--basil)}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0;font-variant-numeric:tabular-nums}
.ings li span:last-child{color:var(--muted);text-align:right}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sheet input[type=text]{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:1 1 180px;min-width:0}
.pick{border-top:1px solid var(--line)}
.pick button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;display:flex;gap:10px;align-items:baseline}
.pick button .n{flex:1;min-width:0}
.pick button.cur{background:var(--basil-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Repas de la maison</span>
    <div class="weekline">
      <h1 id="weekTitle">Les menus de la semaine<small>Chargement…</small></h1>
      <div class="nav">
        <button class="icon-btn" id="prev" aria-label="Semaine précédente">‹</button>
        <button class="icon-btn" id="next" aria-label="Semaine suivante">›</button>
      </div>
    </div>
    <div class="facts" id="facts"></div>
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabMenu" aria-selected="true">Menus</button>
        <button role="tab" id="tabShop" aria-selected="false">Courses</button>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="todayBtn">Cette semaine</button>
      <button class="btn primary" id="pdfBtn" hidden>Télécharger le PDF</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="status" id="status" hidden></div>
<div id="sheetRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
let R = {}, STATE = {foyer:{adultes:6,enfants:0},weeks:{}};
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const RAYONS = ["Fruits et légumes","Viande","Poissonnerie","Frais","Surgelés","Épicerie","Boulangerie"];
const PLACARD = "huile, beurre, lait, sel, poivre, ail, moutarde, vinaigre, bouillon, herbes et épices, sucre, miel";

const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const eur = n => n.toFixed(2).replace(".",",")+" €";

// ---- Foyer : recettes écrites pour 6 portions (5 personnes + 1 de marge) ----
const F = () => STATE.foyer;
const nbPers = () => Math.max(1, F().adultes + F().enfants);
const portions = () => F().adultes + 0.6*F().enfants + 1;
const fac = () => Math.max(0.2, portions()/6);
const fmt = n => String(Math.round(n*10)/10).replace(".",",");
function scaleQ(q,f){
  if(Math.abs(f-1)<0.01) return q;
  const s=String(q), mx=s.match(/^(\d+)\s*×\s*(.*)$/);
  if(mx) return Math.max(1,Math.ceil(parseInt(mx[1],10)*f-0.3))+" × "+mx[2];
  return s.replace(/(\d+(?:,\d+)?)(\s*)(kg|g|cl|l)?(?![\w])/g,(all,num,sp,u)=>{
    let v=parseFloat(num.replace(",","."))*f;
    if(u==="g"){v=Math.max(50,Math.round(v/50)*50); if(v>=1000) return fmt(v/1000)+sp+"kg"; return v+sp+u}
    if(u==="kg"){if(v<1) return Math.max(50,Math.round(v*1000/50)*50)+sp+"g"; return fmt(v)+sp+u}
    if(u==="cl"||u==="l") return fmt(Math.max(u==="cl"?10:0.25,v))+sp+u;
    return Math.max(1,Math.ceil(v-0.3))+sp;
  });
}
const ingF = r => r.i.map(([ray,n,q,p])=>[ray,n,scaleQ(q,fac()),p*fac()]);
const prix = r => r.i.reduce((s,x)=>s+x[3],0)*fac();

// ---- Dates ----
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const key = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseKey = k => {const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays = (d,n) => {const x=new Date(d);x.setDate(x.getDate()+n);return x};
function rangeLabel(mon){const sun=addDays(mon,6);
  return mon.getMonth()===sun.getMonth() ? "du "+mon.getDate()+" au "+sun.getDate()+" "+MONTHS[sun.getMonth()]+" "+sun.getFullYear()
    : "du "+mon.getDate()+" "+MONTHS[mon.getMonth()]+" au "+sun.getDate()+" "+MONTHS[sun.getMonth()]+" "+sun.getFullYear()}

const thisMonday = mondayOf(new Date());
const hot = null;
let current = (hot && hot.week) || store.get("rdm-week", null) || key(thisMonday);
let tab = (hot && hot.tab) || "menu";
let canEdit=false, downloadsApi={};

function recipe(v){ if(!v) return null; if(typeof v==="string") return R[v]?Object.assign({id:v},R[v]):null; return {id:null,n:String(v.n||""),d:"",t:"",p:"",k:0,i:[],mat:"",e:[]} }
const week = k => STATE.weeks[k] || null;
const mealsOf = w => w.soirs.map(recipe).filter(Boolean).concat((w.extras||[]).map(recipe).filter(Boolean));
function status(msg,ms){const s=$("status");s.textContent=msg;s.hidden=false;clearTimeout(status.t);if(ms!==0)status.t=setTimeout(()=>s.hidden=true,ms||2800)}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

// ---------- Rendu ----------
function render(){
  const mon=parseKey(current), w=week(current), isThis=current===key(thisMonday);
  const t=$("weekTitle"); t.textContent=isThis?"Cette semaine ":"Semaine ";
  t.appendChild(el("small",null,rangeLabel(mon)));
  const facts=$("facts"); facts.innerHTML="";
  const c1=el("span","chip"); c1.append(el("b",null,String(nbPers())), " personnes · "+fmt(portions())+" portions par repas"); facts.appendChild(c1);
  if(w){const n=w.soirs.filter(Boolean).length; const c2=el("span","chip"); c2.append(el("b",null,String(n))," repas prévus"); facts.appendChild(c2);
    const tot=mealsOf(w).reduce((s,r)=>s+prix(r),0); if(tot){const c3=el("span","chip"); c3.append("Courses ≈ ",el("b",null,eur(tot))); facts.appendChild(c3)}}
  $("todayBtn").hidden=isThis;
  $("pdfBtn").hidden=!(w && downloadsApi);
  $("tabMenu").setAttribute("aria-selected",tab==="menu"); $("tabShop").setAttribute("aria-selected",tab==="shop");
  const v=$("view"); v.innerHTML="";
  if(!w){ v.appendChild(emptyWeek()); return }
  v.appendChild(tab==="menu"?menuView(w,mon):shopView(w));
}

function emptyWeek(){
  const box=el("div","empty-week");
  box.appendChild(el("h2",null,"Pas encore de menus pour cette semaine"));
  if(canEdit){
    box.appendChild(el("p",null,"Je prépare 5 menus différents des deux semaines précédentes. Vous pourrez ensuite changer ceux qui ne vous tentent pas."));
    const b=el("button","btn primary","Préparer les menus de la semaine");
    b.onclick=()=>{STATE.weeks[current]=generateWeek(); save("Menus préparés")}; box.appendChild(b);
  } else box.appendChild(el("p",null,"Les menus seront publiés ici dès qu'ils seront prêts."));
  return box;
}

function mealMeta(r){
  const meta=el("div","meta");
  if(r.p) meta.appendChild(el("span","tag"+(r.p==="Végétarien"?" veg":""),r.p));
  if(r.t) meta.appendChild(el("span",null,r.t));
  if(r.k) meta.appendChild(el("span","kcal","≈ "+r.k+" kcal"));
  if(r.i.length) meta.appendChild(el("span",null,eur(prix(r))));
  return meta;
}

function menuView(w,mon){
  const box=el("div","days"), today=key(new Date());
  w.soirs.forEach((v,i)=>{
    const date=addDays(mon,i), r=recipe(v);
    const card=el(r||canEdit?"button":"div","day"+(key(date)===today?" today":"")+(r?"":" free"));
    if(r||canEdit){card.type="button"; card.onclick=()=>r&&r.id?openRecipe(r,i):openPicker(i)}
    const dn=el("div","dname",DAYS[i]); dn.appendChild(el("span",null,date.getDate()+" "+MONTHS[date.getMonth()])); card.appendChild(dn);
    const m=el("div","dmeal");
    if(r){ m.appendChild(el("h3",null,r.n)); if(r.d) m.appendChild(el("p","note","Dessert : "+r.d)); if(r.id) m.appendChild(mealMeta(r)) }
    else m.appendChild(el("p","empty",canEdit?"Soir libre · toucher pour ajouter un menu":"Soir libre"));
    card.appendChild(m); box.appendChild(card);
  });
  const ex=(w.extras||[]).map(recipe).filter(Boolean);
  if(ex.length){
    const wrap=el("div","days"); wrap.appendChild(el("h2","section","En plus cette semaine"));
    ex.forEach(r=>{const card=el("button","day"); card.type="button"; card.onclick=()=>openRecipe(r,-1);
      card.appendChild(el("div","dname",r.p.replace(" de la semaine","")));
      const m=el("div","dmeal"); m.append(el("h3",null,r.n), mealMeta(r)); card.appendChild(m); wrap.appendChild(card)});
    const frag=el("div"); frag.style.display="contents"; frag.append(box,wrap); return frag;
  }
  return box;
}

// ---------- Courses ----------
function parseQty(q){const m=String(q).trim().match(/^(\d+(?:[.,]\d+)?)\s*([^\d×+]*)$/); if(!m) return null;
  let n=parseFloat(m[1].replace(",",".")), u=m[2].trim(); if(u==="kg"){n*=1000;u="g"} if(u==="l"){n*=100;u="cl"} return {n,u}}
function fmtQ(n,u){ if(u==="g"&&n>=1000) return fmt(n/1000)+" kg"; if(u==="cl"&&n>=100) return fmt(n/100)+" l"; return u? fmt(n)+" "+u : fmt(n) }
function shoppingList(w){
  const items={};
  mealsOf(w).forEach(r=>ingF(r).forEach(([ray,name,q,p])=>{
    const it=items[name]||(items[name]={name,ray,units:{},other:[],prix:0}); it.prix+=p;
    const pq=parseQty(q); if(pq) it.units[pq.u]=(it.units[pq.u]||0)+pq.n; else it.other.push(q);
  }));
  const groups={};
  Object.values(items).forEach(it=>{it.q=Object.entries(it.units).map(([u,n])=>fmtQ(n,u)).concat(it.other).join(" + "); (groups[it.ray]||(groups[it.ray]=[])).push(it)});
  const order=RAYONS.concat(Object.keys(groups).filter(g=>!RAYONS.includes(g)));
  return order.filter(g=>groups[g]).map(g=>({label:g,items:groups[g].sort((a,b)=>a.name.localeCompare(b.name,"fr"))}));
}
function shopView(w){
  const box=el("div"); box.style.cssText="display:flex;flex-direction:column;gap:18px";
  const list=shoppingList(w), tot=list.reduce((s,g)=>s+g.items.reduce((a,i)=>a+i.prix,0),0), n=list.reduce((s,g)=>s+g.items.length,0);
  const totals=el("div","totals");
  [[String(n),"produits"],[eur(tot),"courses estimées"],[eur(tot/Math.max(1,w.soirs.filter(Boolean).length)/nbPers()),"par personne et par repas"]].forEach(([a,b])=>{const d=el("div");d.append(el("strong",null,a),el("span",null,b));totals.appendChild(d)});
  box.appendChild(totals);
  const grid=el("div","shop"), ck=store.get("rdm-check-"+current,{});
  list.forEach(g=>{
    const sec=el("section"); sec.appendChild(el("h3",null,g.label)); const ul=el("ul");
    g.items.forEach(it=>{const li=el("li",ck[it.name]?"done":""); const lb=el("label"); const cb=el("input"); cb.type="checkbox"; cb.checked=!!ck[it.name];
      cb.id="ck-"+g.label.slice(0,3)+"-"+it.name.replace(/[^a-z0-9]/gi,"_");
      cb.onchange=()=>{ck[it.name]=cb.checked; store.set("rdm-check-"+current,ck); li.className=cb.checked?"done":""};
      lb.append(cb,el("span","n",it.name),el("span","q",it.q)); li.appendChild(lb); ul.appendChild(li)});
    sec.appendChild(ul); grid.appendChild(sec)});
  box.appendChild(grid);
  box.appendChild(el("p","note","Quantités calculées pour "+fmt(portions())+" portions par repas. Les cases cochées restent sur cet appareil. Pas comptés, car vous les avez au placard : "+PLACARD+"."));
  if(canEdit) box.appendChild(foyerForm());
  return box;
}
function foyerForm(){
  const f=el("form","foyer"); f.setAttribute("aria-label","Réglages du foyer");
  const mk=(lab,id,val)=>{const l=el("label",null,lab); const i=el("input"); i.type="number"; i.id=id; i.min="0"; i.max="12"; i.value=val; i.inputMode="numeric"; l.appendChild(i); f.appendChild(l); return i};
  const a=mk("Adultes et ados","f-adultes",F().adultes), e=mk("Enfants de moins de 12 ans","f-enfants",F().enfants);
  const b=el("button","btn","Enregistrer"); b.type="submit"; f.appendChild(b);
  f.onsubmit=ev=>{ev.preventDefault(); const na=Math.max(0,Math.min(12,parseInt(a.value,10)||0)), ne=Math.max(0,Math.min(12,parseInt(e.value,10)||0));
    if(na+ne<1){status("Il faut au moins une personne.");return} STATE.foyer={adultes:na,enfants:ne}; save("Foyer mis à jour")};
  return f;
}

// ---------- Recette ----------
function sheet(title,build){
  const root=$("sheetRoot"); root.innerHTML="";
  const bg=el("div","sheet-bg"); bg.onclick=e=>{if(e.target===bg) close()};
  const sh=el("div","sheet"); sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true"); sh.setAttribute("aria-label",title);
  const head=el("div","sheet-head"); const h=el("h2",null,title); const x=el("button","icon-btn","×"); x.setAttribute("aria-label","Fermer"); x.onclick=close;
  head.append(h,x); const body=el("div","sheet-body"); sh.append(head,body); bg.appendChild(sh); root.appendChild(bg);
  const esc=e=>{if(e.key==="Escape") close()}; document.addEventListener("keydown",esc);
  function close(){root.innerHTML=""; document.removeEventListener("keydown",esc)}
  build(body,close); x.focus();
}
function openRecipe(r,dayIndex){
  sheet(r.n,(b,close)=>{
    b.appendChild(mealMeta(r));
    if(r.d) b.appendChild(el("p",null,"Dessert : "+r.d));
    b.appendChild(el("h4",null,"Ingrédients pour "+fmt(portions())+" portions"));
    const ul=el("ul","ings"); ingF(r).forEach(([,n,q])=>{const li=el("li"); li.append(el("span",null,n),el("span",null,q)); ul.appendChild(li)}); b.appendChild(ul);
    if(r.mat){b.appendChild(el("h4",null,"Matériel")); b.appendChild(el("p",null,r.mat))}
    if(r.e.length){b.appendChild(el("h4",null,"Étapes"));
      if(Math.abs(fac()-1)>0.01) b.appendChild(el("p","note","Les étapes donnent les quantités pour 6 portions : multipliez-les par "+fmt(fac())+"."));
      const ol=el("ol","steps"); r.e.forEach(s=>ol.appendChild(el("li",null,s))); b.appendChild(ol)}
    if(canEdit && dayIndex>=0){const row=el("div","row");
      const c=el("button","btn","Changer ce menu"); c.onclick=()=>{close(); openPicker(dayIndex)};
      const rm=el("button","btn","Libérer ce soir"); rm.onclick=()=>{week(current).soirs[dayIndex]=null; close(); save("Soir libéré")};
      row.append(c,rm); b.appendChild(row)}
  });
}
function openPicker(i){
  const w=week(current), cur=w.soirs[i];
  sheet(DAYS[i]+" soir : choisir un menu",(b,close)=>{
    const apply=v=>{w.soirs[i]=v; close(); save("Menu changé")};
    const row=el("div","row");
    const rnd=el("button","btn primary","Une autre idée au hasard");
    rnd.onclick=()=>{const used=new Set(w.soirs.filter(x=>typeof x==="string")); const pool=Object.keys(R).filter(k=>!R[k].x&&!used.has(k)); apply(pool[Math.floor(Math.random()*pool.length)])};
    const none=el("button","btn","Soir libre"); none.onclick=()=>apply(null); row.append(rnd,none); b.appendChild(row);
    const own=el("div","row"); const inp=el("input"); inp.type="text"; inp.id="customMeal"; inp.maxLength=80; inp.placeholder="Ou écrivez votre propre repas (restes, resto…)";
    if(cur&&typeof cur==="object") inp.value=cur.n;
    const ok=el("button","btn","Utiliser"); ok.onclick=()=>{const t=inp.value.trim(); if(t) apply({n:t})};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault(); ok.click()}}; own.append(inp,ok); b.appendChild(own);
    const s=el("input"); s.type="text"; s.id="searchMeal"; s.placeholder="Chercher : poulet, poisson, végétarien…"; b.appendChild(s);
    const list=el("div","pick"); b.appendChild(list);
    const fill=()=>{list.innerHTML=""; const q=s.value.trim().toLowerCase();
      Object.keys(R).filter(k=>!R[k].x && (!q || (R[k].n+" "+R[k].p).toLowerCase().includes(q))).sort((a,c)=>R[a].n.localeCompare(R[c].n,"fr")).forEach(k=>{
        const bt=el("button",k===cur?"cur":""); bt.type="button"; bt.append(el("span","n",R[k].n),el("span","tag"+(R[k].p==="Végétarien"?" veg":""),R[k].p)); bt.onclick=()=>apply(k); list.appendChild(bt)})};
    s.oninput=fill; fill();
  });
}

// ---------- Nouvelle semaine ----------
function generateWeek(){
  const recent=new Set(); [-7,-14].forEach(d=>{const pw=week(key(addDays(parseKey(current),d))); if(pw) pw.soirs.forEach(v=>typeof v==="string"&&recent.add(v))});
  const pool=Object.keys(R).filter(k=>!R[k].x); for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const fresh=pool.filter(k=>!recent.has(k)).concat(pool.filter(k=>recent.has(k)));
  const picks=[], need={"Végétarien":1,"Léger":1};
  Object.keys(need).forEach(p=>{const k=fresh.find(k=>R[k].p===p&&!picks.includes(k)); if(k) picks.push(k)});
  fresh.forEach(k=>{if(picks.length<5&&!picks.includes(k)) picks.push(k)});
  const soirs=[null,null,null,null,null,null,null]; picks.forEach((k,i)=>soirs[i]=k);
  const prevEx=(week(key(addDays(parseKey(current),-7)))||{}).extras||[];
  return {soirs, extras:[prevEx.includes("gateau")?"soiree":"gateau"]};
}

// ---------- PDF ----------
const CP1252="€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
const pdfText=s=>String(s).replace(/[   ]/g," ").replace(/≈/g,"env.").replace(/[‐‑]/g,"-").replace(/./gu,ch=>ch.charCodeAt(0)<256||CP1252.includes(ch)?ch:"");
async function makePdf(){
  if(!window.jspdf){status("Le module PDF n'a pas chargé. Rechargez la page.");return}
  const w=week(current), mon=parseKey(current); const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=16,B=282, ink=[29,42,36], mute=[93,107,99], basil=[47,122,79], saf=[184,110,0], line=[219,227,220];
  let y;
  const T=(s,x,yy,o)=>doc.text(Array.isArray(s)?s.map(pdfText):pdfText(s),x,yy,o);
  const head=(title,sub)=>{y=20; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...basil); T("REPAS DE LA MAISON",M,y);
    y+=9; doc.setTextColor(...ink); doc.setFontSize(20); T(title,M,y); y+=7; doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...mute); T(sub,M,y); y+=8};
  const need=h=>{if(y+h>B){doc.addPage(); y=20}};
  const sub=rangeLabel(mon).replace(/^du/,"Du")+"  ·  "+nbPers()+" personnes, "+fmt(portions())+" portions par repas";
  // Page 1 : la semaine
  head("Les menus de la semaine",sub);
  doc.setDrawColor(...ink); doc.setLineWidth(.5); doc.line(M,y,W-M,y);
  w.soirs.forEach((v,i)=>{const r=recipe(v), date=addDays(mon,i);
    doc.setFontSize(12); const nm=doc.splitTextToSize(pdfText(r?r.n:"Soir libre"),W-2*M-36);
    const info=r&&r.id?[r.d?"Dessert : "+r.d:"",r.t,r.k?"env. "+r.k+" kcal":""].filter(Boolean).join("  ·  "):"";
    const h=nm.length*5.2+(info?5:0)+8; need(h); const yy=y+6.5;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...saf); T(DAYS[i],M,yy);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...mute); T(date.getDate()+" "+MONTHS[date.getMonth()],M,yy+4.5);
    doc.setFont("helvetica",r?"bold":"italic"); doc.setFontSize(12); doc.setTextColor(...(r?ink:mute)); T(nm,M+36,yy);
    if(info){doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...mute); T(info,M+36,yy+nm.length*5.2)}
    y+=h; doc.setDrawColor(...line); doc.setLineWidth(.3); doc.line(M,y,W-M,y)});
  const ex=(w.extras||[]).map(recipe).filter(Boolean);
  if(ex.length){y+=8; need(14); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...basil); T("EN PLUS CETTE SEMAINE",M,y); y+=6;
    ex.forEach(r=>{doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...ink); T("- "+r.n,M,y); y+=6})}
  // Page 2 : courses
  doc.addPage(); head("Liste de courses","Semaine "+rangeLabel(mon)+"  ·  "+fmt(portions())+" portions par repas");
  const list=shoppingList(w), tot=list.reduce((s,g)=>s+g.items.reduce((a,i)=>a+i.prix,0),0);
  doc.setFontSize(10); doc.setTextColor(...mute); T("Total estimé : "+eur(tot)+". Pas comptés (placard) : "+PLACARD+".",M,y,{maxWidth:W-2*M}); y+=10;
  const top=y, gap=10, cw=(W-2*M-gap)/2; let col=0, cy=top;
  list.forEach(g=>{const h=8+g.items.length*6;
    if(cy+h>B){ if(col===0){col=1;cy=top} else {doc.addPage(); col=0; cy=20} }
    const x=M+col*(cw+gap); doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...basil); T(g.label.toUpperCase(),x,cy);
    doc.setDrawColor(...basil); doc.setLineWidth(.5); doc.line(x,cy+2,x+cw,cy+2); cy+=8;
    g.items.forEach(it=>{doc.setDrawColor(...mute); doc.setLineWidth(.3); doc.rect(x,cy-3.2,3.4,3.4);
      doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...ink);
      const qw=Math.min(cw*0.42,doc.getTextWidth(pdfText(it.q))+1); T(doc.splitTextToSize(pdfText(it.name),cw-8-qw)[0],x+6,cy);
      doc.setTextColor(...mute); T(it.q,x+cw,cy,{align:"right"}); cy+=6}); cy+=5});
  // Une page par recette
  mealsOf(w).filter(r=>r.id).forEach(r=>{
    doc.addPage(); y=20; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...basil);
    const d=w.soirs.indexOf(r.id); T((d>=0?DAYS[d].toUpperCase()+" SOIR":r.p.toUpperCase()),M,y); y+=8;
    doc.setFontSize(17); doc.setTextColor(...ink); const tl=doc.splitTextToSize(pdfText(r.n),W-2*M); T(tl,M,y); y+=tl.length*7;
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...mute);
    T([r.t,r.k?"env. "+r.k+" kcal":"",r.d?"Dessert : "+r.d:""].filter(Boolean).join("  ·  "),M,y); y+=9;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...basil); T("INGRÉDIENTS POUR "+fmt(portions())+" PORTIONS",M,y); y+=6;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...ink);
    const ings=ingF(r), half=Math.ceil(ings.length/2), cw2=(W-2*M-10)/2;
    ings.forEach(([,n,q],k)=>{const x=M+(k<half?0:cw2+10), yy=y+(k%half)*5.6; T(n,x,yy); doc.setTextColor(...mute); T(q,x+cw2,yy,{align:"right"}); doc.setTextColor(...ink)});
    y+=half*5.6+5;
    if(r.mat){doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...basil); T("MATÉRIEL",M,y); y+=5.5;
      doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...ink); const ml=doc.splitTextToSize(pdfText(r.mat),W-2*M); T(ml,M,y); y+=ml.length*5+5}
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...basil); T("ÉTAPES",M,y); y+=6;
    if(Math.abs(fac()-1)>0.01){doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(...mute); T("Les étapes donnent les quantités pour 6 portions : multipliez-les par "+fmt(fac())+".",M,y); y+=6}
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
    r.e.forEach((s,k)=>{const ls=doc.splitTextToSize(pdfText(s),W-2*M-8); need(ls.length*5+2.5);
      doc.setTextColor(...saf); doc.setFont("helvetica","bold"); T(String(k+1),M,y); doc.setFont("helvetica","normal"); doc.setTextColor(...ink); T(ls,M+8,y); y+=ls.length*5+2.5});
  });
  doc.save("menus-semaine-"+current+".pdf"); status("PDF téléchargé");
}
